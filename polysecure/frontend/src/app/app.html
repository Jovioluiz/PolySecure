@if (!auth.isLoggedIn()) {
  <app-login (loggedIn)="onLoggedIn()" />
} @else {
  <div class="workspace">
    <app-navbar
      (loggedOut)="queryResult.set(null); translationSql.set(null)"
      (helpRequested)="showHelp.set(true)"
      [monitoringActive]="showMonitoring()"
      (monitoringToggled)="toggleMonitoring()"
    />

    <div class="workspace-body">
      <app-sidebar (tableSelected)="onTableSelected($event)" />

      <main class="main-content">
        @if (showMonitoring()) {
          <app-monitoring-panel />
        } @else {
          <div class="tab-bar">
            @for (tab of tabs(); track tab.id) {
              <button
                class="tab"
                [class.active]="tab.id === activeTabId()"
                (click)="switchTab(tab.id)"
              >
                {{ tab.label }}
                @if (tabs().length > 1) {
                  <span class="tab-close" (click)="closeTab(tab.id, $event)">×</span>
                }
              </button>
            }
            <button class="tab-add" (click)="addTab()" title="Nova aba">+</button>
          </div>

          <app-editor-panel
            [defaultQuery]="initialSql"
            (result)="onResult($event)"
            (translationReady)="onTranslation($event)"
            (queryChange)="onQueryChange($event)"
          />

          <app-translation-panel
            [sql]="translationSql()"
            (closed)="translationSql.set(null)"
          />

          <app-results-panel [result]="queryResult()" />
        }
      </main>
    </div>
  </div>

  <app-help-modal [showHelp]="showHelp()" (closed)="showHelp.set(false)" />
}
