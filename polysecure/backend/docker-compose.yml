services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: polysecure
      POSTGRES_USER: poly
      POSTGRES_PASSWORD: poly123
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  mongodb:
    image: mongo:7-jammy
    environment:
      MONGO_INITDB_DATABASE: polysecure
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  neo4j:
    image: neo4j:5-community
    environment:
      NEO4J_AUTH: none
    ports:
      - "7474:7474"   # Browser UI
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data

  solr:
    image: solr:9-slim
    ports:
      - "8983:8983"
    volumes:
      - solr_data:/var/solr
    command:
      - solr-precreate
      - produtos

  zipkin:
    image: openzipkin/zipkin:latest
    ports:
      - "9411:9411"   # UI + collector — matches management.zipkin.tracing.endpoint

  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "PolySecure123!"   # register the store with username: sa
    ports:
      - "1433:1433"
    volumes:
      - sqlserver_data:/var/opt/mssql

volumes:
  postgres_data:
  mongo_data:
  neo4j_data:
  solr_data:
  sqlserver_data:
