<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PolySecure — Query Interface</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/theme/dracula.min.css">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg:        #0d1117;
    --surface:   #161b22;
    --border:    #30363d;
    --text:      #e6edf3;
    --muted:     #8b949e;
    --accent:    #58a6ff;
    --green:     #3fb950;
    --red:       #f85149;
    --yellow:    #d29922;
    --purple:    #bc8cff;
    --radius:    6px;
    --font-mono: ui-monospace, "JetBrains Mono", "Fira Code", monospace;
  }

  body { background: var(--bg); color: var(--text); font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; font-size: 14px; height: 100vh; display: flex; flex-direction: column; overflow: hidden; }

  /* ─── LOGIN ─────────────────────────────────────────────────────── */
  #login-overlay {
    position: fixed; inset: 0; background: var(--bg);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .login-card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 40px; width: 360px;
  }
  .brand { font-size: 24px; font-weight: 700; margin-bottom: 8px; text-align: center; }
  .brand-poly   { color: var(--accent); }
  .brand-secure { color: var(--purple); }
  .login-card h2 { text-align: center; color: var(--muted); font-weight: 400; margin-bottom: 28px; font-size: 14px; }
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; margin-bottom: 6px; color: var(--muted); font-size: 12px; text-transform: uppercase; letter-spacing: .05em; }
  .form-group input {
    width: 100%; padding: 10px 12px; background: var(--bg);
    border: 1px solid var(--border); border-radius: var(--radius);
    color: var(--text); font-size: 14px; outline: none; transition: border-color .2s;
  }
  .form-group input:focus { border-color: var(--accent); }
  .btn-primary {
    width: 100%; padding: 10px; background: var(--accent); color: #0d1117;
    border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600;
    cursor: pointer; margin-top: 8px; transition: opacity .2s;
  }
  .btn-primary:hover { opacity: .85; }
  .login-error { color: var(--red); font-size: 13px; margin-top: 12px; text-align: center; min-height: 18px; }

  /* ─── NAVBAR ─────────────────────────────────────────────────────── */
  #app { display: flex; flex-direction: column; height: 100vh; }
  .navbar {
    background: var(--surface); border-bottom: 1px solid var(--border);
    padding: 0 20px; height: 48px; display: flex; align-items: center;
    justify-content: space-between; flex-shrink: 0;
  }
  .nav-brand { font-size: 18px; font-weight: 700; }
  .nav-right { display: flex; align-items: center; gap: 12px; color: var(--muted); font-size: 13px; }
  .btn-ghost {
    background: none; border: 1px solid var(--border); color: var(--text);
    padding: 5px 12px; border-radius: var(--radius); cursor: pointer; font-size: 12px;
    transition: border-color .2s;
  }
  .btn-ghost:hover { border-color: var(--accent); color: var(--accent); }

  /* ─── WORKSPACE ──────────────────────────────────────────────────── */
  .workspace { display: flex; flex: 1; overflow: hidden; }

  /* ─── SIDEBAR ────────────────────────────────────────────────────── */
  .sidebar {
    width: 220px; background: var(--surface); border-right: 1px solid var(--border);
    overflow-y: auto; flex-shrink: 0; padding: 12px 0;
  }
  .sidebar-section { margin-bottom: 16px; }
  .sidebar-section h3 {
    font-size: 11px; text-transform: uppercase; letter-spacing: .08em;
    color: var(--muted); padding: 4px 16px 8px; font-weight: 600;
  }
  .sidebar-item {
    padding: 5px 16px; font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 8px; color: var(--text);
    border-radius: 0;
  }
  .sidebar-item:hover { background: rgba(88,166,255,.08); }
  .sidebar-badge {
    font-size: 10px; padding: 1px 6px; border-radius: 10px; font-weight: 500;
  }
  .badge-pg  { background: rgba(63,185,80,.15); color: var(--green); }
  .badge-mg  { background: rgba(188,140,255,.15); color: var(--purple); }
  .badge-neo { background: rgba(210,153,34,.15); color: var(--yellow); }
  .badge-def { background: rgba(88,166,255,.15); color: var(--accent); }
  .table-cols { padding: 4px 16px 4px 28px; }
  .col-item { font-size: 11px; color: var(--muted); padding: 1px 0; display: flex; gap: 6px; }
  .col-item .col-name { color: var(--text); }
  .col-pk { color: var(--yellow); font-size: 10px; }
  .store-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; margin-top: 3px; }

  /* ─── MAIN CONTENT ───────────────────────────────────────────────── */
  .main-content { flex: 1; display: flex; flex-direction: column; overflow: hidden; }

  /* ─── EDITOR PANEL ───────────────────────────────────────────────── */
  .editor-panel { border-bottom: 1px solid var(--border); display: flex; flex-direction: column; }
  .editor-toolbar {
    padding: 8px 16px; display: flex; align-items: center;
    justify-content: space-between; background: var(--surface);
    border-bottom: 1px solid var(--border); flex-shrink: 0;
  }
  .mode-group { display: flex; gap: 4px; }
  .mode-btn {
    padding: 4px 12px; border-radius: var(--radius); border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer; transition: all .2s;
  }
  .mode-btn.active { background: rgba(88,166,255,.15); border-color: var(--accent); color: var(--accent); }
  .action-group { display: flex; gap: 8px; }
  .btn-translate {
    padding: 5px 14px; border-radius: var(--radius); border: 1px solid var(--border);
    background: transparent; color: var(--muted); font-size: 12px; cursor: pointer;
    transition: all .2s; display: flex; align-items: center; gap: 6px;
  }
  .btn-translate:hover { border-color: var(--purple); color: var(--purple); }
  .btn-run {
    padding: 5px 16px; border-radius: var(--radius); border: none;
    background: var(--green); color: #0d1117; font-size: 12px; font-weight: 600;
    cursor: pointer; display: flex; align-items: center; gap: 6px; transition: opacity .2s;
  }
  .btn-run:hover { opacity: .85; }
  .btn-run:disabled { opacity: .5; cursor: not-allowed; }

  .editor-wrap { position: relative; }
  .CodeMirror {
    height: 180px !important; font-family: var(--font-mono) !important;
    font-size: 13px !important; line-height: 1.6 !important;
  }
  .CodeMirror-scroll { padding-bottom: 0 !important; }

  /* ─── TRANSLATION PANEL ──────────────────────────────────────────── */
  .translation-panel {
    background: #0d1117; border-bottom: 1px solid var(--border); padding: 0;
    flex-shrink: 0;
  }
  .translation-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 6px 16px; border-bottom: 1px solid var(--border);
    font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
  }
  .translation-header .badge-tag {
    background: rgba(188,140,255,.15); color: var(--purple);
    padding: 1px 8px; border-radius: 10px; font-size: 10px;
  }
  .btn-close { background: none; border: none; color: var(--muted); cursor: pointer; font-size: 16px; line-height: 1; }
  .btn-close:hover { color: var(--text); }
  .translation-body { padding: 12px 16px; font-family: var(--font-mono); font-size: 12px; color: var(--purple); white-space: pre-wrap; overflow-x: auto; max-height: 80px; overflow-y: auto; }

  /* ─── RESULTS PANEL ──────────────────────────────────────────────── */
  .results-panel { flex: 1; display: flex; flex-direction: column; overflow: hidden; }
  .results-header {
    padding: 6px 16px; border-bottom: 1px solid var(--border);
    display: flex; align-items: center; justify-content: space-between;
    background: var(--surface); font-size: 11px; color: var(--muted);
    text-transform: uppercase; letter-spacing: .05em; flex-shrink: 0;
  }
  .results-meta { display: flex; gap: 12px; }
  .meta-item { display: flex; align-items: center; gap: 4px; }
  .meta-time { color: var(--yellow); }
  .meta-rows { color: var(--green); }
  #results-body { flex: 1; overflow: auto; }

  .results-table { width: 100%; border-collapse: collapse; font-size: 13px; }
  .results-table th {
    padding: 8px 16px; text-align: left; font-size: 11px; font-weight: 600;
    color: var(--muted); text-transform: uppercase; letter-spacing: .05em;
    border-bottom: 1px solid var(--border); background: var(--surface); position: sticky; top: 0;
  }
  .results-table td {
    padding: 7px 16px; border-bottom: 1px solid rgba(48,54,61,.5);
    font-family: var(--font-mono); font-size: 12px; max-width: 300px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .results-table tr:hover td { background: rgba(88,166,255,.04); }
  .null-val { color: var(--muted); font-style: italic; }
  .num-val { color: var(--green); }
  .bool-val { color: var(--yellow); }

  .empty-state {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    height: 100%; color: var(--muted); gap: 8px;
  }
  .empty-icon { font-size: 32px; opacity: .5; }
  .empty-text { font-size: 13px; }

  .error-box {
    margin: 16px; padding: 12px 16px; background: rgba(248,81,73,.1);
    border: 1px solid rgba(248,81,73,.3); border-radius: var(--radius);
    color: var(--red); font-family: var(--font-mono); font-size: 12px; white-space: pre-wrap;
  }

  .dml-result {
    margin: 16px; padding: 16px; background: rgba(63,185,80,.08);
    border: 1px solid rgba(63,185,80,.25); border-radius: var(--radius);
  }
  .dml-title { color: var(--green); font-weight: 600; margin-bottom: 8px; }
  .dml-detail { font-family: var(--font-mono); font-size: 12px; color: var(--muted); }

  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid var(--border); border-top-color: var(--accent);
    border-radius: 50%; animation: spin .7s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<!-- ─── LOGIN ──────────────────────────────────────────────────── -->
<div id="login-overlay">
  <div class="login-card">
    <div class="brand"><span class="brand-poly">Poly</span><span class="brand-secure">Secure</span></div>
    <h2>Query Interface</h2>
    <div class="form-group">
      <label>Usuário</label>
      <input type="text" id="inp-user" placeholder="admin" autocomplete="username">
    </div>
    <div class="form-group">
      <label>Senha</label>
      <input type="password" id="inp-pass" placeholder="••••••••" autocomplete="current-password">
    </div>
    <button class="btn-primary" id="login-btn" onclick="doLogin()">Entrar</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>

<!-- ─── APP ────────────────────────────────────────────────────── -->
<div id="app" style="display:none; height:100vh; flex-direction:column;">

  <nav class="navbar">
    <div class="nav-brand">
      <span class="brand-poly">Poly</span><span class="brand-secure">Secure</span>
    </div>
    <div class="nav-right">
      <span id="nav-user"></span>
      <button class="btn-ghost" onclick="doLogout()">Sair</button>
    </div>
  </nav>

  <div class="workspace">

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="sidebar-section">
        <h3>Stores</h3>
        <div id="sidebar-stores"><div class="sidebar-item" style="color:var(--muted)">Carregando…</div></div>
      </div>
      <div class="sidebar-section">
        <h3>Tabelas</h3>
        <div id="sidebar-tables"><div class="sidebar-item" style="color:var(--muted)">Carregando…</div></div>
      </div>
    </aside>

    <!-- MAIN -->
    <div class="main-content">

      <!-- EDITOR PANEL -->
      <div class="editor-panel">
        <div class="editor-toolbar">
          <div class="mode-group">
            <button class="mode-btn active" id="btn-mode-std" onclick="setMode('standard')">SQL Padrão (PostgreSQL)</button>
            <button class="mode-btn" id="btn-mode-poly" onclick="setMode('poly')">SQL-Poly (avançado)</button>
          </div>
          <div class="action-group">
            <button class="btn-translate" id="btn-translate" onclick="doTranslate()" title="Ver SQL-Poly gerado internamente">
              ⇄ Ver SQL-Poly
            </button>
            <button class="btn-run" id="btn-run" onclick="doRun()">
              ▶ Executar <span style="opacity:.6;font-weight:400">F5</span>
            </button>
          </div>
        </div>
        <div class="editor-wrap">
          <textarea id="sql-editor"></textarea>
        </div>
      </div>

      <!-- TRANSLATION PREVIEW -->
      <div class="translation-panel" id="translation-panel" style="display:none">
        <div class="translation-header">
          <span>SQL-Poly traduzido <span class="badge-tag">interno</span></span>
          <button class="btn-close" onclick="hideTranslation()">✕</button>
        </div>
        <div class="translation-body" id="translation-body"></div>
      </div>

      <!-- RESULTS -->
      <div class="results-panel">
        <div class="results-header">
          <span>Resultados</span>
          <div class="results-meta" id="results-meta"></div>
        </div>
        <div id="results-body">
          <div class="empty-state">
            <div class="empty-icon">⬡</div>
            <div class="empty-text">Execute uma consulta para ver os resultados</div>
          </div>
        </div>
      </div>

    </div><!-- /main-content -->
  </div><!-- /workspace -->
</div><!-- /app -->

<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/codemirror.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.16/mode/sql/sql.min.js"></script>
<script>
// ─── State ───────────────────────────────────────────────────────────
let token = localStorage.getItem('ps_token');
let username = localStorage.getItem('ps_user');
let mode = 'standard'; // 'standard' | 'poly'
let editor;

// ─── Boot ────────────────────────────────────────────────────────────
document.addEventListener('DOMContentLoaded', () => {
  editor = CodeMirror.fromTextArea(document.getElementById('sql-editor'), {
    mode: 'sql',
    theme: 'dracula',
    lineNumbers: true,
    lineWrapping: true,
    tabSize: 2,
    extraKeys: {
      'F5': doRun,
      'Ctrl-Enter': doRun,
      'Cmd-Enter': doRun
    }
  });

  editor.setValue(
    '-- Exemplo: buscar dados de tabela cross-store\n' +
    'SELECT *\n' +
    'FROM orders\n' +
    'WHERE id = 1'
  );

  // Enter on password field
  document.getElementById('inp-pass').addEventListener('keydown', e => {
    if (e.key === 'Enter') doLogin();
  });

  if (token) {
    showApp();
  }
});

// ─── Auth ─────────────────────────────────────────────────────────────
async function doLogin() {
  const user = document.getElementById('inp-user').value.trim();
  const pass = document.getElementById('inp-pass').value;
  const errEl = document.getElementById('login-error');
  const btn = document.getElementById('login-btn');

  if (!user || !pass) { errEl.textContent = 'Informe usuário e senha.'; return; }

  btn.textContent = 'Entrando…';
  btn.disabled = true;
  errEl.textContent = '';

  try {
    const res = await fetch('/auth/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username: user, password: pass })
    });
    if (!res.ok) throw new Error('Credenciais inválidas.');
    const data = await res.json();
    token = data.token;
    username = user;
    localStorage.setItem('ps_token', token);
    localStorage.setItem('ps_user', username);
    showApp();
  } catch (e) {
    errEl.textContent = e.message || 'Erro ao conectar.';
  } finally {
    btn.textContent = 'Entrar';
    btn.disabled = false;
  }
}

function doLogout() {
  token = null; username = null;
  localStorage.removeItem('ps_token');
  localStorage.removeItem('ps_user');
  document.getElementById('app').style.display = 'none';
  document.getElementById('login-overlay').style.display = 'flex';
  document.getElementById('inp-pass').value = '';
  document.getElementById('login-error').textContent = '';
}

function showApp() {
  document.getElementById('login-overlay').style.display = 'none';
  const app = document.getElementById('app');
  app.style.display = 'flex';
  document.getElementById('nav-user').textContent = username || '';
  loadSidebar();
  setTimeout(() => editor.refresh(), 50);
}

// ─── Mode ─────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('btn-mode-std').classList.toggle('active', m === 'standard');
  document.getElementById('btn-mode-poly').classList.toggle('active', m === 'poly');
  const translateBtn = document.getElementById('btn-translate');
  translateBtn.style.display = m === 'standard' ? 'flex' : 'none';
  hideTranslation();
}

// ─── Sidebar ──────────────────────────────────────────────────────────
async function loadSidebar() {
  await Promise.all([loadStores(), loadTables()]);
}

async function loadStores() {
  try {
    const res = await apiFetch('/catalog/stores');
    const stores = await res.json();
    const el = document.getElementById('sidebar-stores');
    if (!stores.length) { el.innerHTML = '<div class="sidebar-item" style="color:var(--muted)">Nenhum store</div>'; return; }
    el.innerHTML = stores.map(s => {
      const badge = storeBadge(s);
      return `<div class="sidebar-item">
        <span class="store-dot" style="background:${storeColor(s)}"></span>
        <span>${s}</span>
        ${badge}
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('sidebar-stores').innerHTML = '<div class="sidebar-item" style="color:var(--red)">Erro</div>';
  }
}

async function loadTables() {
  try {
    const res = await apiFetch('/catalog/tables');
    const tables = await res.json();
    const el = document.getElementById('sidebar-tables');
    const entries = Object.entries(tables);
    if (!entries.length) { el.innerHTML = '<div class="sidebar-item" style="color:var(--muted)">Nenhuma tabela</div>'; return; }
    el.innerHTML = entries.map(([name, cols]) => {
      const stores = [...new Set(cols.map(c => c.store))];
      const colsHtml = cols.map(c =>
        `<div class="col-item">
          <span class="store-dot" style="background:${storeColor(c.store)};width:6px;height:6px;margin-top:4px"></span>
          <span class="col-name">${c.name}</span>
          <span style="color:var(--muted)">${c.type}</span>
          ${c.primaryKey ? '<span class="col-pk">PK</span>' : ''}
        </div>`
      ).join('');
      return `<div>
        <div class="sidebar-item" onclick="insertTableName('${name}')">
          <span>⊞</span>
          <span>${name}</span>
        </div>
        <div class="table-cols">${colsHtml}</div>
      </div>`;
    }).join('');
  } catch (e) {
    document.getElementById('sidebar-tables').innerHTML = '<div class="sidebar-item" style="color:var(--red)">Erro</div>';
  }
}

function insertTableName(name) {
  const q = mode === 'standard'
    ? `SELECT *\nFROM ${name}\nWHERE id = 1`
    : `SELECT * FROM store.${name}`;
  editor.setValue(q);
  editor.focus();
}

function storeColor(s) {
  if (s.includes('pg') || s.includes('postgres')) return '#3fb950';
  if (s.includes('mg') || s.includes('mongo')) return '#bc8cff';
  if (s.includes('neo')) return '#d29922';
  return '#58a6ff';
}
function storeBadge(s) {
  let cls = 'badge-def', label = s.toUpperCase();
  if (s.includes('pg') || s.includes('postgres')) { cls = 'badge-pg'; label = 'PG'; }
  else if (s.includes('mg') || s.includes('mongo')) { cls = 'badge-mg'; label = 'MG'; }
  else if (s.includes('neo')) { cls = 'badge-neo'; label = 'NEO4J'; }
  return `<span class="sidebar-badge ${cls}">${label}</span>`;
}

// ─── Translation preview ──────────────────────────────────────────────
async function doTranslate() {
  const sql = editor.getValue().trim();
  if (!sql) return;
  try {
    const res = await apiFetch('/query/translate', { method: 'POST', body: JSON.stringify({ sql }) });
    const data = await res.json();
    showTranslation(data.translated);
  } catch (e) {
    showTranslation('Erro: ' + e.message);
  }
}

function showTranslation(sql) {
  document.getElementById('translation-body').textContent = sql;
  document.getElementById('translation-panel').style.display = 'block';
}
function hideTranslation() {
  document.getElementById('translation-panel').style.display = 'none';
}

// ─── Execute ──────────────────────────────────────────────────────────
async function doRun() {
  const sql = editor.getValue().trim();
  if (!sql) return;

  const btn = document.getElementById('btn-run');
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span> Executando…';
  setResultsMeta([]);
  showResultsLoading();

  const endpoint = mode === 'standard' ? '/query/standard' : '/query';
  const t0 = performance.now();

  try {
    const res = await apiFetch(endpoint, { method: 'POST', body: JSON.stringify({ sql }) });
    const elapsed = Math.round(performance.now() - t0);

    if (!res.ok) {
      const err = await res.json().catch(() => ({ message: res.statusText }));
      showError(err.message || JSON.stringify(err));
      setResultsMeta([{ label: `${elapsed} ms`, cls: 'meta-time' }]);
      return;
    }

    const data = await res.json();
    renderResult(data, elapsed);
  } catch (e) {
    showError('Erro de rede: ' + e.message);
  } finally {
    btn.disabled = false;
    btn.innerHTML = '▶ Executar <span style="opacity:.6;font-weight:400">F5</span>';
  }
}

function renderResult(data, elapsed) {
  // SELECT result: { rowCount, rows }
  if (data.rows !== undefined) {
    const rows = data.rows;
    setResultsMeta([
      { label: `${data.rowCount} linha${data.rowCount !== 1 ? 's' : ''}`, cls: 'meta-rows' },
      { label: `${elapsed} ms`, cls: 'meta-time' }
    ]);
    if (!rows.length) {
      document.getElementById('results-body').innerHTML =
        '<div class="empty-state"><div class="empty-icon">∅</div><div class="empty-text">Nenhum resultado</div></div>';
      return;
    }
    const cols = Object.keys(rows[0]);
    const thead = `<thead><tr>${cols.map(c => `<th>${c}</th>`).join('')}</tr></thead>`;
    const tbody = `<tbody>${rows.map(row =>
      `<tr>${cols.map(c => `<td title="${escHtml(String(row[c] ?? ''))}">${formatCell(row[c])}</td>`).join('')}</tr>`
    ).join('')}</tbody>`;
    document.getElementById('results-body').innerHTML =
      `<table class="results-table">${thead}${tbody}</table>`;
    return;
  }

  // DML result: { affectedByStore, ... } or other
  setResultsMeta([{ label: `${elapsed} ms`, cls: 'meta-time' }]);
  const el = document.getElementById('results-body');
  if (data.affectedByStore) {
    const total = Object.values(data.affectedByStore).reduce((a, b) => a + b, 0);
    const detail = Object.entries(data.affectedByStore)
      .map(([s, n]) => `  ${s}: ${n} linha${n !== 1 ? 's' : ''}`)
      .join('\n');
    el.innerHTML = `<div class="dml-result">
      <div class="dml-title">✓ ${total} linha${total !== 1 ? 's' : ''} afetada${total !== 1 ? 's' : ''}</div>
      <div class="dml-detail">${escHtml(detail)}</div>
    </div>`;
  } else {
    el.innerHTML = `<div class="dml-result">
      <div class="dml-title">✓ Operação concluída</div>
      <div class="dml-detail">${escHtml(JSON.stringify(data, null, 2))}</div>
    </div>`;
  }
}

function formatCell(v) {
  if (v === null || v === undefined) return '<span class="null-val">null</span>';
  if (typeof v === 'number') return `<span class="num-val">${v}</span>`;
  if (typeof v === 'boolean') return `<span class="bool-val">${v}</span>`;
  const s = typeof v === 'object' ? JSON.stringify(v) : String(v);
  return escHtml(s.length > 120 ? s.slice(0, 120) + '…' : s);
}

function showError(msg) {
  document.getElementById('results-body').innerHTML =
    `<div class="error-box">✕ ${escHtml(msg)}</div>`;
}

function showResultsLoading() {
  document.getElementById('results-body').innerHTML =
    '<div class="empty-state"><span class="spinner" style="width:20px;height:20px;border-width:3px"></span></div>';
}

function setResultsMeta(items) {
  document.getElementById('results-meta').innerHTML = items.map(i =>
    `<div class="meta-item ${i.cls}">${i.label}</div>`
  ).join('');
}

// ─── Helpers ──────────────────────────────────────────────────────────
function apiFetch(url, opts = {}) {
  return fetch(url, {
    ...opts,
    headers: {
      'Content-Type': 'application/json',
      'Authorization': 'Bearer ' + token,
      ...(opts.headers || {})
    }
  });
}

function escHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}
</script>
